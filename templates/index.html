<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery Shop - Daily Price List</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="container">
    <header>
      <h1>My Grocery Shop</h1>
      <p>Quick Reference Price Board</p>
    </header>

    <!-- Add Item Form -->
    <div class="calc-section">
      <h3>Quick Calculator</h3>
      <div class="form-row">
        <select id="calcItem" onchange="setupCalc()"></select>
    <input type="number" id="calcQty" placeholder="Quantity" min="0" step="any" oninput="runCalc()" />
    <select id="calcUnit" onchange="runCalc()"></select>
  </div>
  <div class="form-row" style="margin-top:10px">
    <input type="number" id="calcAmount" placeholder="Or enter ₹ amount" min="0" step="any" oninput="runReverse()" />
  </div>
  <div id="calcResult" class="calc-result">Select an item and enter a quantity</div>
</div>
<!-- Live Search -->
    <div class="search-container">
      <input 
      type="text" 
      id="searchInput" 
      class="search-input" 
      placeholder="Search item name (e.g., Rice, Sugar, Oil)..." 
      onkeyup="filterTable()"
      />
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table id="itemsTable">
        <caption>List of Items</caption>
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Price</th>
            <th>Measurement</th>
            <th class="action-header">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated from SQLite via API -->
        </tbody>
      </table>
    </div>
  </div>
  <div class="add-item-section">
    <h3>Add New Item</h3>
    <form id="addItemForm" onsubmit="handleAddItem(event)">
      <div class="form-row">
        <input type="text" id="newItemName" placeholder="Item Name (e.g. Rice)" required />
        <input type="text" id="newItemPrice" placeholder="Price (e.g. 90)" required />
        <input type="text" id="newItemMeasurement" placeholder="Unit (e.g. 1 Kg)" required />
        <button type="submit" class="btn btn-add">+ Add Item</button>
      </div>
    </form>
  </div>
  
  <script>
    let itemsData = [];

    function numericPrice(item) {
      const value = Number(String(item.price).replace(/[^\d.]/g, ""));
      return Number.isFinite(value) ? value : NaN;
    }

    function unitInfo(unitText) {
      const text = String(unitText || "").toLowerCase();
      if (text.includes("dozen")) return { amount: 12, base: "piece", label: "pcs" };
      if (text.includes("litre") || text.includes("liter") || /\b1\s*l\b/.test(text))
        return { amount: 1, base: "litre", label: "L" };
      const match = text.match(/(\d+(?:\.\d+)?)\s*(kg|kilogram|gm|g|gram|grams)\b/i);
      if (match) {
        const amount = Number(match[1]);
        const u = match[2].toLowerCase();
        if (u === "kg" || u === "kilogram") return { amount: amount * 1000, base: "gram", label: "g" };
        return { amount, base: "gram", label: "g" };
      }
      if (text.includes("packet")) return { amount: 1, base: "packet", label: "packet" };
      return { amount: 1, base: "unit", label: "unit" };
    }

    function displayQuantity(amount, base) {
      if (base === "gram") return amount >= 1000
        ? `${(amount / 1000).toFixed(3).replace(/\.?0+$/, "")} kg`
        : `${amount.toFixed(2).replace(/\.?0+$/, "")} g`;
      if (base === "litre") return `${amount.toFixed(3).replace(/\.?0+$/, "")} L`;
      if (base === "piece") return `${amount.toFixed(2).replace(/\.?0+$/, "")} pcs`;
      if (base === "packet") return `${amount.toFixed(2).replace(/\.?0+$/, "")} packet(s)`;
      return `${amount.toFixed(2).replace(/\.?0+$/, "")} unit(s)`;
    }

    function populateCalculatorItems() {
      const select = document.getElementById("calcItem");
      const previous = select.value;
      select.innerHTML = '<option value="">Select grocery item</option>';
      itemsData.forEach(item => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name;
        select.appendChild(option);
      });
      if (itemsData.some(item => String(item.id) === previous)) select.value = previous;
      else if (itemsData.length) select.value = String(itemsData[0].id);
      setupCalc();
    }

    function setupCalc() {
      const item = itemsData.find(entry => String(entry.id) === document.getElementById("calcItem").value);
      const unitSelect = document.getElementById("calcUnit");
      unitSelect.innerHTML = "";
      if (!item) {
        document.getElementById("calcResult").textContent = "Select an item and enter a quantity or amount.";
        return;
      }
      const info = unitInfo(item.unit);
      let choices = info.base === "gram"
        ? [{label:"grams (g)", factor:1}, {label:"kilograms (kg)", factor:1000}]
        : info.base === "litre"
          ? [{label:"litres (L)", factor:1}, {label:"millilitres (ml)", factor:0.001}]
          : info.base === "piece"
            ? [{label:"pieces", factor:1}]
            : [{label:info.label, factor:1}];
      choices.forEach(choice => {
        const option = document.createElement("option");
        option.value = choice.factor;
        option.textContent = choice.label;
        unitSelect.appendChild(option);
      });
      document.getElementById("calcQty").value = "";
      document.getElementById("calcAmount").value = "";
      document.getElementById("calcResult").textContent = `Store price: ₹${numericPrice(item).toFixed(2)} per ${item.unit}. Enter quantity or amount.`;
    }

    function runCalc() {
      const item = itemsData.find(entry => String(entry.id) === document.getElementById("calcItem").value);
      if (!item) return;
      const price = numericPrice(item), info = unitInfo(item.unit);
      const qty = Number(document.getElementById("calcQty").value);
      const factor = Number(document.getElementById("calcUnit").value || 1);
      const result = document.getElementById("calcResult");
      if (!(price > 0) || !(info.amount > 0)) {
        result.textContent = "This item's price or measurement format is not supported. Check the store item details.";
        return;
      }
      if (!Number.isFinite(qty) || qty <= 0) {
        result.textContent = `Store price: ₹${price.toFixed(2)} per ${item.unit}. Enter quantity or amount.`;
        return;
      }
      const amount = qty * factor / info.amount * price;
      document.getElementById("calcAmount").value = amount.toFixed(2);
      result.innerHTML = `<strong>${item.name}</strong>: ${qty} × ${document.getElementById("calcUnit").selectedOptions[0].text} = <strong>₹${amount.toFixed(2)}</strong><br>Store price: ₹${price.toFixed(2)} per ${item.unit}`;
    }

    function runReverse() {
      const item = itemsData.find(entry => String(entry.id) === document.getElementById("calcItem").value);
      if (!item) return;
      const price = numericPrice(item), info = unitInfo(item.unit);
      const amount = Number(document.getElementById("calcAmount").value);
      const result = document.getElementById("calcResult");
      if (!(price > 0) || !(info.amount > 0)) {
        result.textContent = "This item's price or measurement format is not supported. Check the store item details.";
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        result.textContent = `Store price: ₹${price.toFixed(2)} per ${item.unit}. Enter the amount the customer wants to spend.`;
        return;
      }
      const baseQuantity = amount / price * info.amount;
      const factor = Number(document.getElementById("calcUnit").value || 1);
      document.getElementById("calcQty").value = (baseQuantity / factor).toFixed(3).replace(/\.?0+$/, "");
      result.innerHTML = `<strong>Give the customer ${displayQuantity(baseQuantity, info.base)}</strong> of ${item.name} for <strong>₹${amount.toFixed(2)}</strong>.<br>Store price: ₹${price.toFixed(2)} per ${item.unit}`;
    }

    
    // Fetch items directly from SQLite database
    async function loadItems() {
      try {
        const res = await fetch('/api/items');
        itemsData = await res.json();
        renderTable();
        populateCalculatorItems();
      } catch (err) {
        console.error("Failed to load items:", err);
      }
    }
    
    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      
      itemsData.forEach(item => {
        const tr = document.createElement("tr");
        tr.setAttribute("id", `row-${item.id}`);
        
        tr.innerHTML = `
        <td class="name-cell">${item.name}</td>
        <td class="price-cell price-col">${item.price}</td>
        <td class="unit-cell"><span class="badge-unit">${item.unit}</span></td>
        <td class="actions-cell">
          <button class="btn btn-edit" onclick="startEdit(${item.id})">Edit</button>
          <button class="btn btn-delete" onclick="deleteItem(${item.id})">Delete</button>
          </td>
          `;
          tbody.appendChild(tr);
        });
    }
    
    // Add item to SQLite
    async function handleAddItem(event) {
      event.preventDefault();
      const name = document.getElementById("newItemName").value.trim();
      const price = document.getElementById("newItemPrice").value.trim();
      const unit = document.getElementById("newItemMeasurement").value.trim();
      
      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, unit })
      });

      if (res.ok) {
        document.getElementById("addItemForm").reset();
        loadItems();
      }
    }
    
    // Switch row into inline editable form
    function startEdit(id) {
      const row = document.getElementById(`row-${id}`);
      const item = itemsData.find(i => i.id === id);
      if (!item) return;
      
      row.innerHTML = `
        <td><input type="text" class="edit-input" id="edit-name-${id}" value="${item.name}" /></td>
        <td><input type="text" class="edit-input" id="edit-price-${id}" value="${item.price}" /></td>
        <td><input type="text" class="edit-input" id="edit-unit-${id}" value="${item.unit}" /></td>
        <td class="actions-cell">
          <button class="btn btn-save" onclick="saveEdit(${id})">Save</button>
          <button class="btn btn-cancel" onclick="renderTable()">Cancel</button>
          </td>
          `;
        }
        
        // Update item in SQLite
        async function saveEdit(id) {
          const updatedName = document.getElementById(`edit-name-${id}`).value.trim();
          const updatedPrice = document.getElementById(`edit-price-${id}`).value.trim();
          const updatedUnit = document.getElementById(`edit-unit-${id}`).value.trim();
          
          const res = await fetch(`/api/items/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: updatedName, price: updatedPrice, unit: updatedUnit })
      });
      
      if (res.ok) {
        loadItems();
      }
    }
    
    // Remove item from SQLite
    async function deleteItem(id) {
      if (!confirm("Are you sure you want to delete this item?")) return;
      
      const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadItems();
      }
    }
    
    // Client-side search filtering
    function filterTable() {
      const filter = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#tableBody tr");
      
      rows.forEach(row => {
        const nameCell = row.querySelector(".name-cell") || row.querySelector("input");
        const val = nameCell ? (nameCell.textContent || nameCell.value) : "";
        row.style.display = val.toLowerCase().includes(filter) ? "" : "none";
      });
    }
    
    window.onload = loadItems;
    </script>
</body>
</html>
