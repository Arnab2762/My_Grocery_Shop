<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery Shop - Daily Price List</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="container">
    <header>
      <h1>My Grocery Shop</h1>
      <p>Quick Reference Price Board</p>
    </header>

    <!-- Add Item Form -->
    <div class="calc-section">
      <h3>Quick Calculator</h3>
      <div class="form-row">
        <select id="calcItem" onchange="setupCalc()"></select>
    <input type="number" id="calcQty" placeholder="Quantity" min="0" step="any" oninput="runCalc()" />
    <select id="calcUnit" onchange="runCalc()"></select>
  </div>
  <div class="form-row" style="margin-top:10px">
    <input type="number" id="calcAmount" placeholder="Or enter ₹ amount" min="0" step="any" oninput="runReverse()" />
  </div>
  <div id="calcResult" class="calc-result">Select an item and enter a quantity</div>
</div>
<!-- Live Search -->
    <div class="search-container">
      <input 
      type="text" 
      id="searchInput" 
      class="search-input" 
      placeholder="Search item name (e.g., Rice, Sugar, Oil)..." 
      onkeyup="filterTable()"
      />
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table id="itemsTable">
        <caption>List of Items</caption>
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Price</th>
            <th>Measurement</th>
            <th class="action-header">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated from SQLite via API -->
        </tbody>
      </table>
    </div>
  </div>
  <div class="add-item-section">
    <h3>Add New Item</h3>
    <form id="addItemForm" onsubmit="handleAddItem(event)">
      <div class="form-row">
        <input type="text" id="newItemName" placeholder="Item Name (e.g. Rice)" required />
        <input type="text" id="newItemPrice" placeholder="Price (e.g. 90)" required />
        <input type="text" id="newItemMeasurement" placeholder="Unit (e.g. 1 Kg)" required />
        <button type="submit" class="btn btn-add">+ Add Item</button>
      </div>
    </form>
  </div>
  
  <script>
    let itemsData = [];
    
    // Fetch items directly from SQLite database
    async function loadItems() {
      try {
        const res = await fetch('/api/items');
        itemsData = await res.json();
        renderTable();
      } catch (err) {
        console.error("Failed to load items:", err);
      }
    }
    
    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      
      itemsData.forEach(item => {
        const tr = document.createElement("tr");
        tr.setAttribute("id", `row-${item.id}`);
        
        tr.innerHTML = `
        <td class="name-cell">${item.name}</td>
        <td class="price-cell price-col">${item.price}</td>
        <td class="unit-cell"><span class="badge-unit">${item.unit}</span></td>
        <td class="actions-cell">
          <button class="btn btn-edit" onclick="startEdit(${item.id})">Edit</button>
          <button class="btn btn-delete" onclick="deleteItem(${item.id})">Delete</button>
          </td>
          `;
          tbody.appendChild(tr);
        });
    }
    
    // Add item to SQLite
    async function handleAddItem(event) {
      event.preventDefault();
      const name = document.getElementById("newItemName").value.trim();
      const price = document.getElementById("newItemPrice").value.trim();
      const unit = document.getElementById("newItemMeasurement").value.trim();
      
      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, unit })
      });

      if (res.ok) {
        document.getElementById("addItemForm").reset();
        loadItems();
      }
    }
    
    // Switch row into inline editable form
    function startEdit(id) {
      const row = document.getElementById(`row-${id}`);
      const item = itemsData.find(i => i.id === id);
      if (!item) return;
      
      row.innerHTML = `
        <td><input type="text" class="edit-input" id="edit-name-${id}" value="${item.name}" /></td>
        <td><input type="text" class="edit-input" id="edit-price-${id}" value="${item.price}" /></td>
        <td><input type="text" class="edit-input" id="edit-unit-${id}" value="${item.unit}" /></td>
        <td class="actions-cell">
          <button class="btn btn-save" onclick="saveEdit(${id})">Save</button>
          <button class="btn btn-cancel" onclick="renderTable()">Cancel</button>
          </td>
          `;
        }
        
        // Update item in SQLite
        async function saveEdit(id) {
          const updatedName = document.getElementById(`edit-name-${id}`).value.trim();
          const updatedPrice = document.getElementById(`edit-price-${id}`).value.trim();
          const updatedUnit = document.getElementById(`edit-unit-${id}`).value.trim();
          
          const res = await fetch(`/api/items/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: updatedName, price: updatedPrice, unit: updatedUnit })
      });
      
      if (res.ok) {
        loadItems();
      }
    }
    
    // Remove item from SQLite
    async function deleteItem(id) {
      if (!confirm("Are you sure you want to delete this item?")) return;
      
      const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadItems();
      }
    }
    
    // Client-side search filtering
    function filterTable() {
      const filter = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#tableBody tr");
      
      rows.forEach(row => {
        const nameCell = row.querySelector(".name-cell") || row.querySelector("input");
        const val = nameCell ? (nameCell.textContent || nameCell.value) : "";
        row.style.display = val.toLowerCase().includes(filter) ? "" : "none";
      });
    }
    
    window.onload = loadItems;
    </script>
</body>
</html>
